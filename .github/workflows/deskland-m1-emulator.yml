name: Deskland M1 frozen APK emulator smoke
on:
  pull_request:
    branches: [feat/deskland-android-widget-host-v049]
    paths:
      - .github/workflows/deskland-m1-emulator.yml
      - scripts/deskland_m1_emulator.py
      - docs/DESKLAND_M1_EXECUTION.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deskland-m1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-smoke:
    name: Android API 35 Home runtime test (not physical QA)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout QA harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reuse exact-run PR 26 debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deskland-apk"
          gh run download 42947060839 --repo "$GITHUB_REPOSITORY" --name adaptive-landscape-android-debug --dir "$RUNNER_TEMP/deskland-apk"
          test -s "$RUNNER_TEMP/deskland-apk/app-debug.apk"
          sha256sum "$RUNNER_TEMP/deskland-apk/app-debug.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual ephemeral emulator smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/deskland_m1_emulator.py "$RUNNER_TEMP/deskland-apk/app-debug.apk"
      - name: Preserve no-screenshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deskland-m1-emulator-evidence
          path: ${{ runner.temp }}/deskland-m1-evidence.json
          if-no-files-found: warn
          retention-days: 14
