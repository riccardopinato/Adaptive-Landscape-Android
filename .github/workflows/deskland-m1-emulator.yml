name: Deskland M1 frozen APK emulator smoke
on:
  pull_request:
    branches: [feat/deskland-android-widget-host-v049]
    paths:
      - .github/workflows/deskland-m1-emulator.yml
      - scripts/deskland_m1_emulator.py
      - android/app/src/main/kotlin/it/riccardopinato/adaptivelandscape/AdaptiveHomeActivity.kt
      - docs/DESKLAND_M1_EXECUTION.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deskland-m1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-smoke:
    name: Android API 35 Home runtime test (not physical QA)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout QA harness at exact PR branch HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reuse exact product-build APK; check source identity and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_native="55624858ee7785c2cbb039cc8acbe93199df7d25"
          actual_native="$(git rev-parse HEAD:android/app/src/main/kotlin/it/riccardopinato/adaptivelandscape/AdaptiveHomeActivity.kt)"
          test "$actual_native" = "$expected_native"
          mkdir -p generated_app/build/app/outputs/flutter-apk
          gh run download 43013339785 --repo "$GITHUB_REPOSITORY" --name deskland-m1-qa-debug-NOT-PLAY-SIGNED --dir generated_app/build/app/outputs/flutter-apk
          printf '%s  %s\n' '598230629bbdd3638ee9dc017f1a0416f4630f50827f4136cc043ae3b95fe074' 'generated_app/build/app/outputs/flutter-apk/app-debug.apk' | sha256sum -c -
      - name: Attach verified frozen debug APK for physical QA (NOT Play signed)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deskland-m1-qa-debug-NOT-PLAY-SIGNED
          path: generated_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual ephemeral emulator smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/deskland_m1_emulator.py generated_app/build/app/outputs/flutter-apk/app-debug.apk
      - name: Preserve no-screenshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deskland-m1-emulator-evidence
          path: ${{ runner.temp }}/deskland-m1-evidence.json
          if-no-files-found: warn
          retention-days: 14
