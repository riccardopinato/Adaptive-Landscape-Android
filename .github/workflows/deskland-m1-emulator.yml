name: Deskland M1 frozen APK emulator smoke
on:
  pull_request:
    branches: [feat/deskland-android-widget-host-v049, qa/deskland-m1-emulator-source-frozen]
    paths:
      - .github/workflows/deskland-m1-emulator.yml
      - scripts/deskland_m1_emulator.py
      - android/app/src/main/kotlin/it/riccardopinato/adaptivelandscape/AdaptiveHomeActivity.kt
      - android/app/src/main/kotlin/it/riccardopinato/adaptivelandscape/AdaptiveWallpaperService.kt
      - android/app/src/main/kotlin/it/riccardopinato/adaptivelandscape/GpuOceanRenderer.kt
      - scripts/validate_repository.py
      - pubspec.yaml
      - android/app/src/main/kotlin/it/riccardopinato/adaptivelandscape/MainActivity.kt
      - android/app/src/main/AndroidManifest.xml
      - docs/DESKLAND_M1_EXECUTION.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deskland-m1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-smoke:
    name: Android API 35 Home runtime test (not physical QA)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout QA harness at exact PR branch HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate native renderer and privacy contracts
        run: python3 scripts/validate_repository.py
      - name: Set up Flutter for this source SHA
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - name: Configure Android JDK 17
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          flutter config --jdk-dir="$JAVA_HOME_17_X64"
      - name: Compile exact-head Android debug APK with Dart and native code checks
        run: bash BOOTSTRAP_LINUX_MAC.sh generated_app
      - name: Record compiled APK hash
        run: |
          test -s generated_app/build/app/outputs/flutter-apk/app-debug.apk
          sha256sum generated_app/build/app/outputs/flutter-apk/app-debug.apk
      - name: Publish exact-build debug APK for device QA (NOT Play signed)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deskland-m1-qa-debug-NOT-PLAY-SIGNED
          path: generated_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual ephemeral emulator smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/deskland_m1_emulator.py generated_app/build/app/outputs/flutter-apk/app-debug.apk
      - name: Preserve no-screenshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deskland-m1-emulator-evidence
          path: ${{ runner.temp }}/deskland-m1-evidence.json
          if-no-files-found: warn
          retention-days: 14
