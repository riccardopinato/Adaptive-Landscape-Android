name: MVP Android and Web Preview
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix-android-v041-gpu-wallpaper-and-home-calibration, feat/v042-photographic-ocean, feat/v043-web-photo-preview, feat/v044-realism, feat/v045-smart-calibration, feat/v046-perf-qa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-landscape-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, build APK and Web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository source privacy + localization contract
        run: python3 scripts/validate_repository.py

      - name: Shell QA capture script static syntax (no physical device)
        run: bash -n scripts/physical_qa_capture.sh
      - name: Universal APK verification script lint
        run: bash -n scripts/verify_universal_apk.sh
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Select JDK 17 for Android Gradle (avoid runner default Java 25)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64:-}"
          test -x "$JAVA_HOME_17_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          flutter config --jdk-dir="$JAVA_HOME_17_X64"
          "$JAVA_HOME_17_X64/bin/java" -version
      - name: Generate Flutter project, analyze, test and build Android debug APK
        run: bash BOOTSTRAP_LINUX_MAC.sh generated_app
      - name: Build smaller per-ABI internal release-mode APKs (not Play-signed)
        working-directory: generated_app
        run: flutter build apk --release --split-per-abi --dart-define=BUILD_SOURCE_SHA=${{ github.sha }}
      - name: Build universal internal Android APK (all supported ABIs)
        working-directory: generated_app
        run: flutter build apk --release --dart-define=BUILD_SOURCE_SHA=${{ github.sha }}
      - name: Verify universal APK ABI coverage and record Android requirements
        shell: bash
        run: |
          bash scripts/verify_universal_apk.sh \
            generated_app/build/app/outputs/flutter-apk/app-release.apk \
            generated_app/build/app/outputs/flutter-apk
      - name: Build Web-only interactive editor preview
        working-directory: generated_app
        run: flutter build web --release --base-href /Adaptive-Landscape-Android/ --dart-define=BUILD_SOURCE_SHA=${{ github.sha }}
      - name: Upload debug APK for physical testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adaptive-landscape-android-debug
          path: generated_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload smaller internal per-ABI APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adaptive-landscape-internal-optimized-NOT-PLAY-SIGNED
          path: generated_app/build/app/outputs/flutter-apk/*release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload universal APK for Android compatibility testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adaptive-landscape-universal-internal-NOT-PLAY-SIGNED
          path: |
            generated_app/build/app/outputs/flutter-apk/app-release.apk
            generated_app/build/app/outputs/flutter-apk/APK_COMPATIBILITY.txt
            generated_app/build/app/outputs/flutter-apk/SHA256SUMS-universal.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload Web preview as Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: generated_app/build/web

  deploy-preview:
    name: Publish Web preview (not Android wallpaper)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
