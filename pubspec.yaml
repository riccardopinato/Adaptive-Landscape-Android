name: adaptive_landscape
version: 0.4.3+10
description: Original Android adaptive live-wallpaper app with Flutter settings UI.
publish_to: none
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.3.4
  file_picker: ^12.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  shaders:
    - shaders/beach_ocean.frag
